<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#d31926">
    <title>OutRun - Sega Mega Drive | Kubo Touch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b10;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #header {
            width: 100%;
            max-width: 800px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #d31926, #ff5e3a);
            box-shadow: 0 4px 15px rgba(211, 25, 38, 0.4);
            z-index: 10;
        }
        #header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-style: italic;
        }
        #header span {
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        #game-wrapper {
            width: 100%;
            max-width: 800px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }
        #game {
            width: 100%;
            height: 100%;
            min-height: 75vh;
        }
        #rom-loader {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1e1e2a 0%, #0b0b10 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 20;
        }
        .car-badge {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        #rom-loader h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #ff4757;
            font-style: italic;
        }
        #rom-loader p {
            font-size: 0.9rem;
            color: #a4b0be;
            max-width: 400px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .btn-upload {
            background: linear-gradient(135deg, #ff4757, #d31926);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.15s ease;
        }
        .btn-upload:active {
            transform: scale(0.96);
        }
        #rom-input {
            display: none;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>OUTRUN</h1>
        <span>MEGA DRIVE</span>
    </div>

    <div id="game-wrapper">
        <!-- Visível apenas se HOSTED_ROM_URL estiver vazio ou se o carregamento automático falhar -->
        <div id="rom-loader">
            <div class="car-badge">🏎
