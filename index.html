<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f17" />
  <title>OutRun — Sega Mega Drive | Kubo Touch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1b2238 0%, #0b0d14 70%);
      color: #f4f6fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      background: rgba(20, 24, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff4d6d;
      background: rgba(255, 77, 109, 0.14);
      border: 1px solid rgba(255, 77, 109, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #a3adc2;
      margin-bottom: 16px;
    }

    .cover-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 360px;
      margin: 0 auto 16px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #121520;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn-play {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #ff2a55, #ff6b35);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-play:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    .local-rom {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #9aa4b8;
    }

    .local-rom input[type="file"] {
      display: none;
    }

    .local-link {
      color: #6ea8fe;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 600;
    }

    #emulator-wrapper {
      display: none;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="card-container" id="launcher">
    <span class="badge">Sega Mega Drive • 1991</span>
    <h1>OutRun</h1>
    <p class="subtitle">Kubo Touch — Toque em jogar para iniciar</p>

    <div class="cover-box">
      <!-- Substitua COVER_DATA_URI pela imagem da capa se quiser embuti-la via data URL -->
      <img id="cover-img" src="./outrun-cover.jpg" alt="Capa do jogo OutRun Sega Mega Drive" onerror="this.style.display='none'" />
    </div>

    <button class="btn-play" id="start-btn" type="button">▶ Iniciar Jogo</button>

    <div class="local-rom">
      Ou <label for="rom-input" class="local-link">selecione o arquivo da ROM (.md / .bin)</label>
      <input type="file" id="rom-input" accept=".md,.bin,.gen,.smd,.zip" />
    </div>
  </div>

  <div id="emulator-wrapper">
    <div id="game"></div>
  </div>

  <script>
    const launcher = document.getElementById("launcher");
    const emulatorWrapper = document.getElementById("emulator-wrapper");
    const startBtn = document.getElementById("start-btn");
    const romInput = document.getElementById("rom-input");

    let customRomUrl = null;
    let started = false;

    romInput.addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (customRomUrl) URL.revokeObjectURL(customRomUrl);
      customRomUrl = URL.createObjectURL(file);
      launchEmulator(customRomUrl);
    });

    startBtn.addEventListener("click", () => {
      // Altere o caminho abaixo para o nome real da sua ROM hospedada junto ao HTML
      const defaultRomUrl = customRomUrl || "./OutRun.md";
      launchEmulator(defaultRomUrl);
    });

    function launchEmulator(romUrl) {
      if (started) return;
      started = true;

      launcher.style.display = "none";
      emulatorWrapper.style.display = "block";

      window.EJS_player = "#game";
      window.EJS_core = "segaMD";
      window.EJS_gameName = "OutRun";
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_language = "pt-BR";

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.async = true;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
