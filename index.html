<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OutRun - Kubo Touch</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        body { overflow-x: hidden; overflow-y: auto; }
        body.playing { overflow: hidden; }

        header {
            position: sticky;
            top: 0;
            width: 100%;
            text-align: center;
            padding: 15px;
            background: #1e1e1e;
            z-index: 5;
        }

        .badge {
            background: #333333;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #555;
        }

        #game-card {
            width: calc(100% - 40px);
            max-width: 440px;
            margin: 24px auto;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* ---------- CAIXA 3D DO MEGA DRIVE / GENESIS ---------- */
        .scene {
            position: relative;
            width: 100%;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1100px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            background: radial-gradient(ellipse at 50% 85%, #3a1d1d 0%, #1e1e1e 72%);
        }
        .scene.grabbing { cursor: grabbing; }

        .case {
            --w: 185px;
            --h: 260px;
            --d: 36px;
            position: relative;
            width: var(--w);
            height: var(--h);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .face {
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: #141414;
            border: 1px solid #0a0a0a;
        }

        /* Frente (Capa) */
        .face-front {
            --shine: 50%;
            width: var(--w);
            height: var(--h);
            transform: translateZ(calc(var(--d) / 2));
            overflow: hidden;
            border-radius: 2px 4px 4px 2px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        }
        .face-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
        }
        /* Brilho plástico da capa */
        .face-front::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                115deg,
                transparent calc(var(--shine) - 22%),
                rgba(255,255,255,0.28) var(--shine),
                transparent calc(var(--shine) + 22%)
            );
            pointer-events: none;
        }

        /* Verso da Caixa */
        .face-back {
            width: var(--w);
            height: var(--h);
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
            background: linear-gradient(180deg, #b81d24 0%, #b81d24 14%, #181818 14%, #111 100%);
            border-radius: 4px 2px 2px 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ccc;
            font-size: 9px;
            text-align: center;
        }
        .back-header {
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            font-size: 11px;
            padding-top: 2px;
        }
        .back-art {
            border: 1px solid #444;
            background: #222;
            padding: 8px 6px;
            border-radius: 4px;
            line-height: 1.35;
        }
        .back-art strong {
            display: block;
            color: #ffd700;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .back-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
            padding-top: 6px;
            font-size: 8px;
            color: #888;
        }
        .sega-mini {
            font-weight: 900;
            letter-spacing: 1px;
            color: #e74c3c;
            font-size: 11px;
        }

        /* Lombada Esquerda */
        .face-left {
            width: var(--d);
            height: var(--h);
            left: calc((var(--w) - var(--d)) / 2);
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
            background: linear-gradient(90deg, #8e151a 0%, #c8232c 25%, #b81d24 85%, #7a1115 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-radius: 3px;
        }
        .spine-system {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 2px;
            color: #e0e0e0;
            text-shadow: 1px 1px 0 #000;
        }
        .spine-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 1px;
            color: #ffd700;
            text-shadow: 1px 1px 0 #000;
        }
        .spine-sega {
            font-weight: 900;
            font-size: 9px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Lateral Direita */
        .face-right {
            width: var(--d);
            height: var(--h);
            left: calc((var(--w) - var(--d)) / 2);
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
            background: linear-gradient(90deg, #1b1b1b 0%, #0d0d0d 45%, #262626 50%, #0d0d0d 55%, #1b1b1b 100%);
        }

        /* Topo e Base da Caixa */
        .face-top {
            width: var(--w);
            height: var(--d);
            top: calc((var(--h) - var(--d)) / 2);
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background: linear-gradient(180deg, #1c1c1c, #111);
        }
        .hang-tab {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%) translateZ(0px);
            width: 52px;
            height: 16px;
            background: #181818;
            border: 1px solid #333;
            border
